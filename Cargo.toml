[package]
name = "vpn-client"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
# Asynchronous runtime for non-blocking I/O operations
tokio = { version = "1", features = ["net", "io-util", "macros", "rt-multi-thread", "time", "sync"] }

# TLS 1.3 client for secure transport layer.
# Keep the default backend (aws-lc-rs): it offers the post-quantum key exchange X25519MLKEM768, the "ring" feature does not.
rustls = "0.23"
webpki-roots = "1.0"
tokio-rustls = "0.26"

# Command-line argument parsing
clap = { version = "4", features = ["derive"] }

# Error handling with error chains
anyhow = "1"

# Structured logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
rcgen = "0.14"
